<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ФОРМА — Тренировки Дома</title>
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0e0e10;
    --bg2:#17171a;
    --card:#1d1d21;
    --card2:#232327;
    --line:#2b2b30;
    --text:#f2f1ee;
    --muted:#9a9aa0;
    --accent:#ff5e3a;
    --accent2:#ffb23a;
    --good:#4fd68a;
    --bad:#ff6767;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, #2a1710 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #12181a 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 0;}

  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top .logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#1a0d05;
  }
  header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .streak{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:7px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;
  }

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{
    flex:1;text-align:center;padding:10px 0;border-radius:14px;
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    font-size:13px;font-weight:700;cursor:pointer;user-select:none;
    transition:.15s;
  }
  .tab.active{background:var(--accent);color:#1a0d05;border-color:var(--accent);}

  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .card-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:10px;}

  .today-hero{
    background:linear-gradient(150deg,#241209,#1a1a1d 55%);
    border:1px solid #3a2214;
  }
  .day-type{font-size:22px;font-weight:800;margin:2px 0 4px;}
  .day-meta{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .bar-toggle{
    display:flex;align-items:center;gap:9px;margin-top:12px;
    background:rgba(255,178,58,.1);border:1px solid rgba(255,178,58,.3);
    border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;
    color:var(--accent2);cursor:pointer;
  }
  .bar-toggle input{width:17px;height:17px;accent-color:var(--accent);}
  .level-pill{
    display:inline-block;background:rgba(255,94,58,.15);color:var(--accent2);
    border:1px solid rgba(255,94,58,.35);padding:4px 10px;border-radius:100px;
    font-size:12px;font-weight:700;margin-right:6px;
  }

  .ex{
    background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:10px;
  }
  .ex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ex-name{font-size:15px;font-weight:700;}
  .ex-target{font-size:12px;color:var(--muted);margin-top:2px;}
  .sets{display:flex;gap:7px;flex-wrap:wrap;}
  .set-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);color:var(--muted);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .set-btn.done{background:var(--good);border-color:var(--good);color:#062315;}
  .rest-btn{
    margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--accent2);
    font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;cursor:pointer;
  }

  .primary-btn{
    width:100%;padding:15px;border:none;border-radius:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a0d05;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;
  }
  .primary-btn:disabled{opacity:.4;}
  .ghost-btn{
    width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);
    background:transparent;color:var(--text);font-weight:700;font-size:14px;cursor:pointer;
  }

  .rest-overlay{
    position:fixed;inset:0;background:rgba(10,8,6,.92);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;
  }
  .rest-overlay.show{display:flex;}
  .rest-ring{font-size:64px;font-weight:800;color:var(--accent2);}
  .rest-label{color:var(--muted);margin-top:6px;font-size:14px;}
  .rest-skip{margin-top:26px;padding:12px 28px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;}

  .weight-row{display:flex;gap:10px;align-items:center;}
  .weight-input{
    flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    padding:12px;color:var(--text);font-size:15px;font-weight:700;
  }
  .weight-input:focus{outline:none;border-color:var(--accent);}
  .add-btn{background:var(--accent);color:#1a0d05;border:none;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat b{display:block;font-size:20px;margin-bottom:2px;}
  .stat span{font-size:12px;color:var(--muted);}

  canvas{width:100%;height:140px;display:block;}

  .hist-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .d{color:var(--muted);}

  .note{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .note b{color:var(--text);}

  footer.foot{text-align:center;color:#55555c;font-size:11px;margin:30px 0 10px;letter-spacing:.4px;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--good);color:#062315;font-weight:700;font-size:13px;
    padding:12px 20px;border-radius:100px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">Ф</div>
      <div>
        <h1>ФОРМА</h1>
        <div class="sub">твоя программа дома</div>
      </div>
    </div>
    <div class="streak" id="streakBadge">🔥 0</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-screen="today">Сегодня</div>
    <div class="tab" data-screen="progress">Прогресс</div>
    <div class="tab" data-screen="plan">План</div>
  </div>

  <!-- TODAY -->
  <section class="screen active" id="screen-today"></section>

  <!-- PROGRESS -->
  <section class="screen" id="screen-progress">
    <div class="card">
      <div class="card-title">Вес тела</div>
      <div class="weight-row">
        <input type="number" step="0.1" inputmode="decimal" class="weight-input" id="weightInput" placeholder="Вес сегодня, кг">
        <button class="add-btn" id="addWeightBtn">Добавить</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Динамика</div>
      <canvas id="weightChart" height="140"></canvas>
      <div class="note" id="weightNote" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <div class="card-title">Статистика</div>
      <div class="stat-grid">
        <div class="stat"><b id="statTotal">0</b><span>тренировок всего</span></div>
        <div class="stat"><b id="statStreak">0</b><span>дней подряд</span></div>
        <div class="stat"><b id="statWeek">0</b><span>уровень нагрузки</span></div>
        <div class="stat"><b id="statCycle">1/7</b><span>день цикла</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">История</div>
      <div id="historyList"><div class="empty">Пока пусто — начни первую тренировку</div></div>
    </div>
  </section>

  <!-- PLAN -->
  <section class="screen" id="screen-plan"></section>

  <footer class="foot">ПАПА ШАБДАН · сделано для себя</footer>
</div>

<div class="rest-overlay" id="restOverlay">
  <div class="rest-ring" id="restTime">30</div>
  <div class="rest-label">отдых между подходами</div>
  <button class="rest-skip" id="restSkip">Пропустить</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- DATA ---------------- */

const DAY_TYPES = [
  { key:'push', title:'Грудь и руки', emoji:'💪', desc:'Отжимания и работа на трицепс',
    exercises:[
      { name:'Отжимания классические', sets:[3,3,3,4], reps:[8,10,10,12], unit:'повт.' },
      { name:'Отжимания узким хватом', sets:[3,3,3,4], reps:[6,8,10,10], unit:'повт.' },
      { name:'Отжимания с широкой постановкой рук', sets:[3,3,3,4], reps:[8,10,12,12], unit:'повт.' },
      { name:'Планка на прямых руках', sets:[3,3,3,3], reps:[20,30,40,50], unit:'сек' },
      { name:'Отжимания на брусьях', sets:[3,3,3,4], reps:[6,8,10,10], unit:'повт.', bar:true },
    ]},
  { key:'legs', title:'Ноги и ягодицы', emoji:'🦵', desc:'Приседания и работа на низ тела',
    exercises:[
      { name:'Приседания классические', sets:[3,3,4,4], reps:[15,18,18,20], unit:'повт.' },
      { name:'Выпады на месте (на каждую ногу)', sets:[3,3,3,4], reps:[10,12,14,14], unit:'повт.' },
      { name:'Приседания сумо', sets:[3,3,3,4], reps:[12,14,16,16], unit:'повт.' },
      { name:'Подъём на носки', sets:[3,3,3,4], reps:[15,20,25,25], unit:'повт.' },
    ]},
  { key:'core', title:'Кор и пресс', emoji:'🔥', desc:'Пресс и стабилизация корпуса',
    exercises:[
      { name:'Скручивания', sets:[3,3,3,4], reps:[15,18,20,20], unit:'повт.' },
      { name:'Планка классическая', sets:[3,3,3,3], reps:[30,40,50,60], unit:'сек' },
      { name:'Подъём ног лёжа', sets:[3,3,3,4], reps:[10,12,15,15], unit:'повт.' },
      { name:'Русский твист', sets:[3,3,3,4], reps:[16,20,24,24], unit:'повт.' },
    ]},
  { key:'back', title:'Спина и осанка', emoji:'🧍', desc:'Разгибатели спины и осанка',
    exercises:[
      { name:'Супермен', sets:[3,3,3,4], reps:[12,15,18,18], unit:'повт.' },
      { name:'Лодочка (удержание)', sets:[3,3,3,3], reps:[20,30,40,50], unit:'сек' },
      { name:'Обратные отжимания от стула', sets:[3,3,3,4], reps:[8,10,12,12], unit:'повт.' },
      { name:'Ягодичный мостик', sets:[3,3,3,4], reps:[15,18,20,20], unit:'повт.' },
      { name:'Подтягивания (широкий или обычный хват)', sets:[3,3,3,4], reps:[3,5,6,8], unit:'повт.', bar:true },
      { name:'Вис на турнике (удержание)', sets:[3,3,3,3], reps:[15,25,35,45], unit:'сек', bar:true },
    ]},
  { key:'full', title:'Круговая на всё тело', emoji:'⚡', desc:'Кардио + сила, самый интенсивный день',
    exercises:[
      { name:'Бёрпи', sets:[3,3,3,4], reps:[6,8,10,10], unit:'повт.' },
      { name:'Приседания с выпрыгиванием', sets:[3,3,3,4], reps:[8,10,12,12], unit:'повт.' },
      { name:'Скалолаз (альпинист)', sets:[3,3,3,4], reps:[16,20,24,24], unit:'повт.' },
      { name:'Планка с касанием плеч', sets:[3,3,3,4], reps:[16,20,24,24], unit:'повт.' },
      { name:'Подъём ног в висе на турнике', sets:[3,3,3,4], reps:[6,8,10,12], unit:'повт.', bar:true },
    ]},
  { key:'mobility', title:'Гибкость и восстановление', emoji:'🧘', desc:'Лёгкий день — растяжка и дыхание',
    exercises:[
      { name:'Растяжка ног и бёдер', sets:[1], reps:[300], unit:'сек' },
      { name:'Растяжка спины и плеч', sets:[1], reps:[180], unit:'сек' },
      { name:'Дыхательные упражнения', sets:[1], reps:[300], unit:'сек' },
    ]},
  { key:'rest', title:'Активный отдых', emoji:'🚶', desc:'Прогулка 20–30 минут в спокойном темпе',
    exercises:[
      { name:'Прогулка на свежем воздухе', sets:[1], reps:[1200], unit:'сек' },
      { name:'Лёгкая растяжка всего тела', sets:[1], reps:[300], unit:'сек' },
    ]},
];

const LEVEL_LABELS = ['База (1–2 нед.)','Развитие (3–4 нед.)','Рост (5–6 нед.)','Поддержание (7+ нед.)'];

/* ---------------- STATE ---------------- */

const DEFAULT_STATE = {
  cycleDay: 1,      // 1..7, maps to DAY_TYPES index (0..6)
  level: 0,         // 0..3
  totalWorkouts: 0,
  streak: 0,
  lastCompletedDate: null,
  history: [],       // { date, dayKey, dayTitle }
  weights: [],        // { date, kg }
  todayProgress: {},  // { exIndex: [bool,...] }, reset each new day
  barMode: false       // турник/брусья доступны сегодня, reset each new day
};

function loadState(){
  try{
    const raw = localStorage.getItem('forma_state');
    if(!raw) return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw));
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){ localStorage.setItem('forma_state', JSON.stringify(state)); }

let state = loadState();

function todayStr(){ return new Date().toISOString().slice(0,10); }

// reset today's checkboxes if it's a new calendar day since last open
(function ensureFreshDay(){
  const openKey = 'forma_last_open_date';
  const last = localStorage.getItem(openKey);
  const t = todayStr();
  if(last !== t){
    state.todayProgress = {};
    state.barMode = false;
    localStorage.setItem(openKey, t);
    saveState();
  }
})();

/* ---------------- RENDER: TODAY ---------------- */

function currentDayType(){
  return DAY_TYPES[(state.cycleDay - 1) % 7];
}

function renderToday(){
  const day = currentDayType();
  const isTracked = day.exercises[0].sets.length > 1;
  const levelIdx = Math.min(state.level, 3);
  const hasBarOptions = day.exercises.some(ex=>ex.bar);
  const visibleExercises = day.exercises
    .map((ex,i)=>({ex,i}))
    .filter(({ex})=> !ex.bar || state.barMode);

  let exHtml = visibleExercises.map(({ex, i})=>{
    const setsCount = ex.sets[Math.min(levelIdx, ex.sets.length-1)];
    const repsVal = ex.reps[Math.min(levelIdx, ex.reps.length-1)];
    const done = state.todayProgress[i] || Array(setsCount).fill(false);
    const isTime = ex.unit === 'сек';
    const targetLabel = isTime ? `${repsVal} сек × ${setsCount} подх.` : `${repsVal} повт. × ${setsCount} подх.`;
    let setsHtml = '';
    for(let s=0; s<setsCount; s++){
      setsHtml += `<div class="set-btn ${done[s]?'done':''}" data-ex="${i}" data-set="${s}">${done[s]?'✓':s+1}</div>`;
    }
    return `
      <div class="ex">
        <div class="ex-head">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-target">${targetLabel}</div>
          </div>
          ${setsCount>1 ? `<button class="rest-btn" data-rest="45">⏱ отдых</button>` : ''}
        </div>
        <div class="sets">${setsHtml}</div>
      </div>`;
  }).join('');

  const allDone = visibleExercises.every(({ex,i})=>{
    const setsCount = ex.sets[Math.min(levelIdx, ex.sets.length-1)];
    const done = state.todayProgress[i] || [];
    return done.filter(Boolean).length >= setsCount;
  });

  const completedToday = state.lastCompletedDate === todayStr();

  document.getElementById('screen-today').innerHTML = `
    <div class="card today-hero">
      <span class="level-pill">День ${state.cycleDay} из 7</span>
      <span class="level-pill">${LEVEL_LABELS[levelIdx]}</span>
      <div class="day-type">${day.emoji} ${day.title}</div>
      <div class="day-meta">${day.desc}</div>
      ${hasBarOptions ? `
        <label class="bar-toggle">
          <input type="checkbox" id="barToggle" ${state.barMode ? 'checked' : ''}>
          <span>🏗️ Сегодня дойду до турника/брусьев</span>
        </label>` : ''}
    </div>
    ${exHtml}
    <button class="primary-btn" id="completeBtn" ${completedToday ? 'disabled' : ''}>
      ${completedToday ? '✓ Тренировка завершена сегодня' : (allDone ? 'Завершить тренировку' : 'Завершить тренировку')}
    </button>
    <div class="note" style="margin-top:12px;">
      Не обязательно отмечать всё, чтобы завершить день — организм сейчас может быть не в лучшей форме из-за стресса. Слушай себя, лучше меньше, но регулярно.
    </div>
  `;

  document.querySelectorAll('.set-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exI = +btn.dataset.ex, setI = +btn.dataset.set;
      if(!state.todayProgress[exI]) state.todayProgress[exI] = [];
      state.todayProgress[exI][setI] = !state.todayProgress[exI][setI];
      saveState();
      renderToday();
    });
  });

  document.querySelectorAll('[data-rest]').forEach(btn=>{
    btn.addEventListener('click', ()=> startRest(+btn.dataset.rest));
  });

  const barToggle = document.getElementById('barToggle');
  if(barToggle){
    barToggle.addEventListener('change', ()=>{
      state.barMode = barToggle.checked;
      saveState();
      renderToday();
    });
  }

  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn && !completedToday){
    completeBtn.addEventListener('click', completeWorkout);
  }
}

function completeWorkout(){
  const day = currentDayType();
  const t = todayStr();

  // streak logic
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if(state.lastCompletedDate === yesterday || state.streak === 0){
    state.streak = state.lastCompletedDate === yesterday ? state.streak + 1 : 1;
  } else if(state.lastCompletedDate !== t){
    state.streak = 1;
  }

  state.lastCompletedDate = t;
  state.totalWorkouts += 1;
  state.history.unshift({ date:t, dayKey:day.key, dayTitle:day.title });
  state.history = state.history.slice(0, 60);

  // advance cycle
  state.cycleDay = state.cycleDay >= 7 ? 1 : state.cycleDay + 1;
  if(state.cycleDay === 1){
    state.level = Math.min(state.level + 1, 3);
  }

  saveState();
  showToast('Отлично! Тренировка сохранена 💪');
  renderToday();
  updateStreakBadge();
}

/* ---------------- REST TIMER ---------------- */

let restInterval = null;
function startRest(seconds){
  const overlay = document.getElementById('restOverlay');
  const timeEl = document.getElementById('restTime');
  let left = seconds;
  timeEl.textContent = left;
  overlay.classList.add('show');
  clearInterval(restInterval);
  restInterval = setInterval(()=>{
    left -= 1;
    if(left <= 0){
      clearInterval(restInterval);
      overlay.classList.remove('show');
      if(navigator.vibrate) navigator.vibrate(200);
      return;
    }
    timeEl.textContent = left;
  }, 1000);
}
document.getElementById('restSkip').addEventListener('click', ()=>{
  clearInterval(restInterval);
  document.getElementById('restOverlay').classList.remove('show');
});

/* ---------------- PROGRESS SCREEN ---------------- */

function renderProgress(){
  document.getElementById('statTotal').textContent = state.totalWorkouts;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('statWeek').textContent = LEVEL_LABELS[state.level].split(' ')[0];
  document.getElementById('statCycle').textContent = `${state.cycleDay}/7`;

  const histList = document.getElementById('historyList');
  if(state.history.length === 0){
    histList.innerHTML = '<div class="empty">Пока пусто — начни первую тренировку</div>';
  } else {
    histList.innerHTML = state.history.slice(0,10).map(h=>`
      <div class="hist-item"><span>${h.dayTitle}</span><span class="d">${formatDate(h.date)}</span></div>
    `).join('');
  }

  drawWeightChart();

  const note = document.getElementById('weightNote');
  if(state.weights.length >= 2){
    const first = state.weights[0].kg;
    const last = state.weights[state.weights.length-1].kg;
    const diff = (last - first).toFixed(1);
    if(diff > 0){
      note.innerHTML = `<b>+${diff} кг</b> с начала отслеживания. Двигаешься в сторону восстановления — хороший знак.`;
    } else if(diff < 0){
      note.innerHTML = `<b>${diff} кг</b> с начала отслеживания. Если вес продолжит падать без причины — стоит показаться врачу, а не только тренироваться.`;
    } else {
      note.innerHTML = `Вес стабилен. Продолжай в том же духе.`;
    }
  } else {
    note.textContent = 'Добавь пару замеров, чтобы увидеть динамику.';
  }
}

function formatDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('ru-RU', { day:'2-digit', month:'short' });
}

function drawWeightChart(){
  const canvas = document.getElementById('weightChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 140;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const data = state.weights.slice(-14);
  if(data.length === 0){
    ctx.fillStyle = '#55555c';
    ctx.font = '13px sans-serif';
    ctx.fillText('Нет данных о весе', 10, h/2);
    return;
  }
  const vals = data.map(d=>d.kg);
  const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
  const pad = 10;
  const stepX = data.length > 1 ? (w - pad*2) / (data.length - 1) : 0;

  ctx.beginPath();
  data.forEach((d,i)=>{
    const x = pad + stepX*i;
    const y = h - pad - ((d.kg - min)/(max-min)) * (h - pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#ff5e3a');
  grad.addColorStop(1,'#ffb23a');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.stroke();

  data.forEach((d,i)=>{
    const x = pad + stepX*i;
    const y = h - pad - ((d.kg - min)/(max-min)) * (h - pad*2);
    ctx.beginPath();
    ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fillStyle = '#0e0e10';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffb23a';
    ctx.stroke();
  });
}

document.getElementById('addWeightBtn').addEventListener('click', ()=>{
  const input = document.getElementById('weightInput');
  const val = parseFloat(input.value);
  if(!val || val < 30 || val > 250){ showToast('Введи корректный вес'); return; }
  const t = todayStr();
  const existing = state.weights.find(w=>w.date===t);
  if(existing) existing.kg = val; else state.weights.push({ date:t, kg:val });
  state.weights.sort((a,b)=> a.date > b.date ? 1 : (a.date < b.date ? -1 : 0));
  saveState();
  input.value = '';
  showToast('Вес сохранён');
  renderProgress();
});

        Основа — только своё тело. В дни рук и спины есть бонусные упражнения на турнике/брусьях —

/* ---------------- TABS / TOAST ---------------- */

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('screen-'+tab.dataset.screen).classList.add('active');
    if(tab.dataset.screen === 'progress') renderProgress();
    if(tab.dataset.screen === 'plan') renderPlan();
  });
});

let toastTimeout;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=> t.classList.remove('show'), 2200);
}

function updateStreakBadge(){
  document.getElementById('streakBadge').textContent = `🔥 ${state.streak}`;
}
